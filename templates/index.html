<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkShort - Encurtador de URL</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="main">
        <div class="tabs">
            <button id="aba-encurtar" class="tab active">Encurtar URL</button>
            <button id="aba-historico" type="button" class="tab">Resumo</button>
        </div>

        <div id="encurtar" class="tab-panel active">
            <div class="input-group">
                <label for="CampoUrl">Cole sua URL aqui</label>
                <input class="text" type="url" id="CampoUrl" placeholder="https://exemplo.com/pagina-muito-longa" />
            </div>
            <button id="btn-encurtar-agora" class="btn-encurtar">Encurtar Agora</button>
        </div>

        <div id="historico" class="tab-panel">
            <div class="input-group">
                <label for="campoBusca">Buscar no histórico</label>
                <input class="text" type="text" id="campoBusca" placeholder="Digite uma URL para buscar..." />
            </div>
            <button id="btn-buscar-historico" class="btn-encurtar">Resumo</button>
            <p id="resultado2"></p>
        </div>

        <div id="resultado-box" class="tab-panel">
            <h2 class="title">URL encurtada com sucesso!!</h2>
            <div id="result">
                <p class="resultado" id="resultado"></p>
            </div>
            <div class="buttons">
                <button id="btn-voltar" class="btn-encurtar">Voltar</button>
                <button id="btn-copiar" class="btn-encurtar">Copiar</button>
            </div>
        </div>
    </div>

    <script type="module">
        // --- FUNÇÕES DO SEU SISTEMA ---

        async function encurtarUrl() {
            try {
                const urlInput = document.getElementById("CampoUrl").value.trim();
                const resposta = document.getElementById("resultado");

                if(urlInput === ""){
                    alert("Campo está vazio, digite algo!!!");
                } else {
                    const response = await fetch("https://encurtador-de-link-zfeq.onrender.com/receber", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ url: urlInput })
                    });
                    const data = await response.json();
                    resposta.textContent = data.url;

                    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                    document.querySelector('.tabs').style.display = 'none';
                    document.getElementById('resultado-box').classList.add('active');
                    document.getElementById("CampoUrl").value = "";
                }
            } catch (error) {
                document.getElementById("resultado").textContent = "Ocorreu um erro ao encurtar a URL.";
                document.getElementById("CampoUrl").value = "";
            }
        }

        function trocarAba(idAbaAlvo, botaoClicado) {
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            
            document.getElementById(idAbaAlvo).classList.add('active');
            botaoClicado.classList.add('active');
            document.querySelector('.tabs').style.display = 'flex';
        }

        async function copiarUrl(){
            try {
                const Url = document.getElementById('resultado').textContent;
                await navigator.clipboard.writeText(Url);
                alert("Url copiada com sucesso!!!");
            } catch {
                const Url = document.getElementById("resultado").textContent;
                alert("Não foi possível copiar a URL: " + Url);
            }
        }

        function buscarHistorico() {
            // Criada para não dar erro de falta de definição do botão resumo
            console.log("Buscando histórico...");
        }


        // --- VINCULAÇÃO DOS CLIQUES (EVENT LISTENERS) ---

        // Cliques das Abas Superiores
        document.getElementById("aba-encurtar").addEventListener("click", function() {
            trocarAba('encurtar', this);
        });

        document.getElementById("aba-historico").addEventListener("click", function() {
            trocarAba('historico', this);
        });

        // Clique do botão de encurtar
        document.getElementById("btn-encurtar-agora").addEventListener("click", encurtarUrl);

        // Clique do botão de histórico
        document.getElementById("btn-buscar-historico").addEventListener("click", buscarHistorico);

        // Clique do botão Copiar
        document.getElementById("btn-copiar").addEventListener("click", copiarUrl);

        // Clique do botão Voltar (Ajustado para restaurar a aba 'encurtar' e mostrar o menu)
        document.getElementById("btn-voltar").addEventListener("click", function() {
            const botaoOrigem = document.getElementById("aba-encurtar");
            trocarAba('encurtar', botaoOrigem);
        });
    </script>
</body>
</html>
