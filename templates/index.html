<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkShort - Encurtador de URL</title>
    <link rel="stylesheet" href="../static/pagina.css">
</head>
<body>
    <div class="main">
        <div class="tabs">
            <button class="tab active" onclick="trocarAba('encurtar', this)">Encurtar URL</button>

            <button type="resumo" class="tab active" onclick="trocarAba('historico', this)">Resumo</button>
        </div>

        <div id="encurtar" class="tab-panel active">
                <div class="input-group">
                <label for="CampoUrl">Cole sua URL aqui</label>
                <input class="text" type="url" id="CampoUrl" placeholder="https://exemplo.com/pagina-muito-longa" />
            </div>
            <button class="btn-encurtar" onclick="encurtarUrl()">Encurtar Agora</button>
        </div>

        <div id="historico" class="tab-panel">
            <div class="input-group">
                <label for="campoBusca">Buscar no histórico</label>
                <input class="text" type="text" id="campoBusca" placeholder="Digite uma URL para buscar..." />
            </div>
            <button class="btn-encurtar" onclick="buscarHistorico()">Resumo</button>
            <p id="resultado2"></p>
        </div>
        <div id="resultado-box" class="tab-panel">
            <h2 class="title">URL encurtada com sucesso!!</h2>
            <div id="result">
                <p class="resultado" id="resultado"></p>
            </div>
            <div class="buttons">
                <button class="btn-encurtar" onclick="trocarAba('encurtar', this)">Voltar</button>
                <button class="btn-encurtar" onclick="copiarUrl()">copiar</button>
            </div>
        </div>
    </div>
    <script>
        async function encurtarUrl() {

            try {
                const urlInput = document.getElementById("CampoUrl").value;
                const resposta = document.getElementById("resultado");

                if(urlInput == ""){
                    alert("Campo está vazio, digite algo!!!");
                } else {
                    const response =  await fetch("https://encurtador-de-link-zfeq.onrender.com", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ url: urlInput })
                    });
                    const data = await response.json();
                    resposta.textContent = data.url;

                    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                    document.querySelector('.tabs').style.display = 'none';
                    document.getElementById('resultado-box').classList.add('active');
                    document.getElementById("CampoUrl").value = " ";
                    }
            } catch (error) {
                document.getElementById("resultado").textContent = "Ocorreu um erro ao encurtar a URL.";
                document.getElementById("CampoUrl").value = " ";
            }
    }
    function trocarAba(id, el) {
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
        document.querySelector('.tabs').style.display = 'flex';
    }

    function copiarUrl(){
        try{
            const Url = document.getElementById('resultado').textContent;
            navigator.clipboard.writeText(Url);
            alert("Url copiada com sucesso!!!");
        } catch {
            const Url = document.getElementById("resultado").textContent;
            alert("não foi possível copiar a URL" + Url);
        }
    }
    </script>

</body>
</html>
